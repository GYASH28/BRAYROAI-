name: BRAYROAI Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brayroai-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Production deployment + browser + load + Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROD_URL: https://brayroai.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium + Firefox
        # playwright.config.mjs includes the targeted firefox-smoke project.
        run: npx playwright install --with-deps chromium firefox
      - name: Build exact merged source
        run: npm run build

      - name: Verify canonical Vercel serves this exact commit
        id: production
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DEPLOYED_COMMIT=""
          HTTP_CODE="000"

          # Verify the actual canonical deployment, not merely a GitHub status.
          # Vite injects x-brayro-commit from VERCEL_GIT_COMMIT_SHA.
          for i in {1..24}; do
            HTTP_CODE=$(curl -L -sS --max-time 25 -o /tmp/brayroai-prod-home.html -w '%{http_code}' "$PROD_URL/" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              DEPLOYED_COMMIT=$(grep -o 'name="x-brayro-commit" content="[^"]*"' /tmp/brayroai-prod-home.html | sed -E 's/.*content="([^"]*)"/\1/' | head -n1 || true)
              echo "Observed production commit: ${DEPLOYED_COMMIT:-missing} (wanted $GITHUB_SHA)"
              if [ "$DEPLOYED_COMMIT" = "$GITHUB_SHA" ]; then
                break
              fi
            else
              echo "Production HTTP status: $HTTP_CODE"
            fi
            sleep 10
          done

          printf 'commit=%s\nproduction_url=%s\nhttp_code=%s\ndeployed_commit=%s\n' \
            "$GITHUB_SHA" "$PROD_URL" "$HTTP_CODE" "${DEPLOYED_COMMIT:-missing}" \
            > artifacts/deployment-verification.txt

          test "$HTTP_CODE" = "200"
          test "$DEPLOYED_COMMIT" = "$GITHUB_SHA"
          grep -q 'BRAYROAI' /tmp/brayroai-prod-home.html
          grep -q 'Digital, designed' /tmp/brayroai-prod-home.html

          # Write route responses to files before grepping. With pipefail,
          # `curl | grep -q` can report curl 23 after grep exits early even
          # when the requested content is present.
          curl -fsSL --max-time 25 "$PROD_URL/clients" -o /tmp/brayroai-prod-clients.html
          grep -q 'CLIENT ARCHIVE' /tmp/brayroai-prod-clients.html
          curl -fsSL --max-time 25 "$PROD_URL/clients/fakhrimart" -o /tmp/brayroai-prod-fakhrimart.html
          grep -q 'Not a fake ecommerce store' /tmp/brayroai-prod-fakhrimart.html
          echo 'Production exact-SHA and clean client routes verified.'

      - name: Production concurrent load test
        env:
          BASE_URL: https://brayroai.vercel.app
          STRESS_REQUESTS: 360
          STRESS_CONCURRENCY: 20
        run: npm run test:stress

      - name: Production browser and accessibility suite
        env:
          BASE_URL: https://brayroai.vercel.app
        run: npx playwright test

      - name: Production Lighthouse mobile audit
        run: |
          mkdir -p artifacts/production-lighthouse
          npx lighthouse "$PROD_URL/" --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path=artifacts/production-lighthouse/home.json
          node tests/lighthouse-budget.mjs artifacts/production-lighthouse/home.json

      - name: Record failed production verification context
        if: failure() && steps.production.outcome == 'failure'
        run: |
          echo 'Canonical production verification failed for this GitHub SHA or one of the required clean routes.' >> artifacts/deployment-verification.txt
          echo 'Inspect the exact-SHA marker and /clients + /clients/fakhrimart responses before treating production as current.' >> artifacts/deployment-verification.txt

      - name: Upload production QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brayroai-production-qa-${{ github.run_number }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
