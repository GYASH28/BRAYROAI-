name: Render BRAYROAI HyperFrames Opening

on:
  push:
    branches:
      - hyperframes/brayroai-opening-cinematic-v2
    paths:
      - 'hyperframes/brayroai-opening-cinematic-v2/**'
      - '.github/workflows/hyperframes-brayroai-opening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hyperframes/brayroai-opening-cinematic-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audio dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Generate cinematic sound design
        run: python make_audio.py

      - name: Verify media
        run: |
          test -f assets/brayroai-cinematic-sfx.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1 assets/brayroai-cinematic-sfx.wav

      - name: HyperFrames environment
        run: npx --yes hyperframes@0.8.8 info

      - name: HyperFrames lint
        run: npx --yes hyperframes@0.8.8 lint . --verbose

      - name: HyperFrames validate
        run: npx --yes hyperframes@0.8.8 validate .

      - name: HyperFrames inspect
        run: npx --yes hyperframes@0.8.8 inspect . --samples 17

      - name: HyperFrames high-quality render
        run: npx --yes hyperframes@0.8.8 render . --output BRAYROAI_CINEMATIC_OPENING_HYPERFRAMES_V2.mp4 --fps 60 --quality high --workers 2 --strict

      - name: Verify rendered master
        run: |
          test -s BRAYROAI_CINEMATIC_OPENING_HYPERFRAMES_V2.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json BRAYROAI_CINEMATIC_OPENING_HYPERFRAMES_V2.mp4

      - name: Create website-silent encode
        run: |
          ffmpeg -y -i BRAYROAI_CINEMATIC_OPENING_HYPERFRAMES_V2.mp4 -an -c:v libx264 -preset slow -crf 20 -pix_fmt yuv420p -movflags +faststart BRAYROAI_CINEMATIC_OPENING_HYPERFRAMES_V2_WEB.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: BRAYROAI-CINEMATIC-HYPERFRAMES-V2
          path: |
            hyperframes/brayroai-opening-cinematic-v2/BRAYROAI_CINEMATIC_OPENING_HYPERFRAMES_V2.mp4
            hyperframes/brayroai-opening-cinematic-v2/BRAYROAI_CINEMATIC_OPENING_HYPERFRAMES_V2_WEB.mp4
            hyperframes/brayroai-opening-cinematic-v2/index.html
            hyperframes/brayroai-opening-cinematic-v2/DESIGN.md
          retention-days: 14
