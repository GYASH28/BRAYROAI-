name: BRAYROAI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brayroai-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Build + architecture integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:static
      - name: Guard production bundle
        run: |
          set -euo pipefail

          for f in \
            index.html plans.html founder.html terms.html \
            ai-workflow-audit.html company-second-brain.html \
            clients.html fakhrimart-case-study.html \
            commercial-cut.js direction-pass.js contact-priority.js \
            brayro-v12.js brayro-v14.js brayro-v15.js \
            experience-motion-v16.js cinematic-v18.js cinematic-v20.js \
            brayro-cursor-v22.css brayro-cursor-v22.js rae.css rae.js \
            ai-service-pages.css ai-service-pages.js client-work.css client-work.js \
            plans-page.css plans-page.js founder-page.css founder-page.js \
            terms-page.css terms-page.js scrollcraft.css scrollcraft.js; do
            test -f "dist/$f"
          done
          test -f api/rae.js
          test -f dist/assets/brayro-home.css
          test -f dist/assets/brayroai-cinematic-opening.mp4
          test -f dist/assets/brayroai-cinematic-opening-silent.mp4
          test -f dist/assets/fakhrimart-case-desktop.png
          test -f dist/assets/fakhrimart-case-mobile.png

          # Homepage ships one ordered CSS file. Rae and the V22 cursor are
          # included in that bundle rather than creating more render blocking.
          grep -q 'data-brayro-home-styles' dist/index.html
          grep -q '/assets/brayro-home.css' dist/index.html
          ! grep -q 'href="/brayro-v12.css"' dist/index.html
          ! grep -q 'href="/brayro-v15.css"' dist/index.html
          ! grep -q 'href="/cinematic-v20.css"' dist/index.html
          ! grep -q 'href="/rae.css"' dist/index.html
          ! grep -q 'href="/brayro-cursor-v22.css"' dist/index.html
          grep -q 'data-layout-stable-fonts' dist/index.html
          grep -q 'name="x-brayro-commit"' dist/index.html

          grep -q '.v12-project-index' dist/assets/brayro-home.css
          ! grep -q '.brayro-ledger' dist/assets/brayro-home.css
          ! grep -q '.play-scene__cursor' dist/assets/brayro-home.css
          grep -q '.v16-page-transition' dist/assets/brayro-home.css
          grep -q 'body.home-v19' dist/assets/brayro-home.css
          grep -q '.v20-scene-rail' dist/assets/brayro-home.css
          grep -q '.v22-cursor' dist/assets/brayro-home.css
          grep -q '.rae-root' dist/assets/brayro-home.css

          # Client proof and offer architecture.
          grep -q 'data-editorial-sequence' dist/index.html
          grep -q 'FEATURED CLIENT / FAKHRIMART' dist/index.html
          grep -q 'fakhriyarns.vercel.app' dist/index.html
          grep -q '/clients/fakhrimart' dist/index.html
          grep -q 'AI Workflow Audit' dist/index.html
          grep -q 'Company Second Brain' dist/index.html
          grep -q '₹2,599' dist/index.html
          grep -q '₹9,999' dist/index.html
          grep -q '₹17,999' dist/index.html
          grep -q '₹25K–₹35K+' dist/index.html
          grep -q '₹29,999' dist/index.html

          grep -q 'BRAYROAI / CLIENT ARCHIVE' dist/clients.html
          grep -q 'data-client-filter="upcoming"' dist/clients.html
          grep -q 'VERIFIED CLIENT / 2026 / PUNE' dist/fakhrimart-case-study.html
          grep -q 'Not a fake ecommerce store.' dist/fakhrimart-case-study.html
          grep -q 'No fabricated conversion uplift' dist/fakhrimart-case-study.html
          grep -q 'class ClientArchive' dist/client-work.js

          # Current runtime ownership: replaced pointer/film layers must stay gone.
          ! grep -q 'class CapabilityLedger' dist/brayro-v12.js
          grep -q 'class CinematicPricingPreview' dist/brayro-v14.js
          ! grep -q 'class CinematicCapabilities' dist/brayro-v14.js
          grep -q 'class PlayfulCapabilities' dist/brayro-v15.js
          ! grep -q 'data-v15-cursor' dist/brayro-v15.js
          grep -q 'class ProcessLab' dist/ai-service-pages.js
          grep -q 'class ArchitectureLab' dist/ai-service-pages.js
          grep -q 'class SceneKinetics' dist/experience-motion-v16.js
          ! grep -q 'class PointerFeedback' dist/experience-motion-v16.js
          grep -q 'class CinematicScrollDirector' dist/cinematic-v18.js
          grep -q 'class ComponentMounts' dist/cinematic-v20.js
          grep -q 'class PolishDirector' dist/cinematic-v20.js
          ! grep -q 'class PointerPolish' dist/cinematic-v20.js
          grep -q 'v22CursorMounted' dist/brayro-cursor-v22.js
          grep -q 'class Rae' dist/rae.js
          grep -q 'shouldUseGemini' dist/rae.js
          grep -q 'process.env.GEMINI_API_KEY' api/rae.js
          grep -q "'x-goog-api-key':key" api/rae.js

          # Secondary pages get direct lightweight motion/cursor/Rae styles.
          for page in plans.html founder.html terms.html ai-workflow-audit.html company-second-brain.html clients.html fakhrimart-case-study.html; do
            grep -q '/experience-motion-v16.css' "dist/$page"
            grep -q '/brayro-cursor-v22.css' "dist/$page"
            grep -q '/rae.css' "dist/$page"
            grep -q '/experience-motion-v16.js' "dist/$page"
            grep -q '/brayro-cursor-v22.js' "dist/$page"
            grep -q '/rae.js' "dist/$page"
          done
          grep -q '/rae.js' dist/index.html
          grep -q '/brayro-cursor-v22.js' dist/index.html
          grep -q '/brayro-v15.js' dist/index.html
          grep -q '/cinematic-v18.js' dist/index.html
          grep -q '/cinematic-v20.js' dist/index.html

          ! grep -q 'data-v18-reel' dist/index.html
          ! grep -q 'data-commercial-film' dist/index.html
          ! grep -q 'data-signal-chamber' dist/index.html
          test ! -f dist/experience-v2.css

          TOTAL=$(du -sk dist | cut -f1)
          echo "dist size: ${TOTAL}KB"
          test "$TOTAL" -lt 10700

  browser-and-load:
    name: Browser + a11y + load + Lighthouse
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium + Firefox
        run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/brayroai-preview.log 2>&1 &
          for i in {1..40}; do
            if \
              curl -fsS http://127.0.0.1:4173/ | grep -q 'Company Second Brain' && \
              curl -fsS http://127.0.0.1:4173/assets/brayro-home.css | grep -q 'rae-root' && \
              curl -fsS http://127.0.0.1:4173/rae.js | grep -q 'class Rae' && \
              curl -fsS http://127.0.0.1:4173/brayro-cursor-v22.js | grep -q 'v22CursorMounted' && \
              curl -fsS http://127.0.0.1:4173/ai-workflow-audit | grep -q 'AI WORKFLOW AUDIT' && \
              curl -fsS http://127.0.0.1:4173/company-second-brain | grep -q 'COMPANY SECOND BRAIN' && \
              curl -fsS http://127.0.0.1:4173/clients | grep -q 'CLIENT ARCHIVE' && \
              curl -fsS http://127.0.0.1:4173/clients/fakhrimart | grep -q 'Not a fake ecommerce store'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/brayroai-preview.log
          exit 1
      - name: Concurrent stress test
        env:
          BASE_URL: http://127.0.0.1:4173
          STRESS_REQUESTS: 900
          STRESS_CONCURRENCY: 45
        run: npm run test:stress
      - name: Chromium + targeted Firefox interaction tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test
      - name: Capture key pages
        run: |
          mkdir -p artifacts/screenshots
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [device,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
              const context=await browser.newContext({viewport:{width,height}});
              const page=await context.newPage();
              for(const [route,name] of [['/','home'],['/plans','plans'],['/founder','founder'],['/terms','terms'],['/ai-workflow-audit','audit'],['/company-second-brain','second-brain'],['/clients','clients'],['/clients/fakhrimart','fakhrimart-case-study']]){
                await page.goto(`http://127.0.0.1:4173${route}`,{waitUntil:'networkidle'});
                await page.evaluate(()=>{document.querySelectorAll('.opening-sequence,.scope-open,.founder-open').forEach(n=>n.remove());document.body.classList.remove('hf-intro-active','polish-opening','is-opening')});
                await page.waitForTimeout(700);
                await page.screenshot({path:`artifacts/screenshots/${device}-${name}.png`,fullPage:false});
              }
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Lighthouse mobile audit
        run: |
          mkdir -p artifacts/lighthouse
          npx lighthouse http://127.0.0.1:4173/ --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path=artifacts/lighthouse/home.json
          node tests/lighthouse-budget.mjs artifacts/lighthouse/home.json
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brayroai-qa-${{ github.run_number }}
          path: |
            dist/
            artifacts/
            test-results/
            /tmp/brayroai-preview.log
          if-no-files-found: ignore
          retention-days: 14
