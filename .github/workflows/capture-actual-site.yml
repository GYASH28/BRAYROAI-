name: Capture actual live agency build

on:
  push:
    branches: [actual-site-recovery]
    paths:
      - '.github/workflows/capture-actual-site.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: https://ykg-digital-agency-v3.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: actual-site-recovery
          fetch-depth: 1

      - name: Capture raw responses
        run: |
          set -euo pipefail
          rm -rf reference-capture
          mkdir -p reference-capture/raw reference-capture/assets reference-capture/screenshots
          curl --retry 4 --retry-delay 2 -fsSL "$TARGET/" -o reference-capture/raw/home.html
          curl --retry 4 --retry-delay 2 -fsSL "$TARGET/case-study" -o reference-capture/raw/case-study.html
          curl --retry 4 --retry-delay 2 -fsSL "$TARGET/robots.txt" -o reference-capture/raw/robots.txt || true
          curl --retry 4 --retry-delay 2 -fsSL "$TARGET/sitemap.xml" -o reference-capture/raw/sitemap.xml || true
          curl -fsSIL "$TARGET/" > reference-capture/raw/home-headers.txt || true

      - name: Discover and download same-origin assets
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          from pathlib import Path
          import hashlib, json, re

          target = 'https://ykg-digital-agency-v3.vercel.app/'
          raw = Path('reference-capture/raw/home.html').read_text(errors='replace')

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  for k in ('src','href'):
                      if d.get(k): self.urls.append((tag,k,d[k]))
                  if d.get('srcset'):
                      for item in d['srcset'].split(','):
                          u=item.strip().split(' ')[0]
                          if u: self.urls.append((tag,'srcset',u))
          p=P(); p.feed(raw)
          base=urlparse(target)
          out=[]
          seen=set()
          for tag,attr,u in p.urls:
              if u.startswith(('mailto:','tel:','javascript:','#','data:')): continue
              absu=urljoin(target,u)
              pr=urlparse(absu)
              if pr.netloc != base.netloc: continue
              if absu in seen: continue
              seen.add(absu)
              ext=Path(pr.path).suffix.lower()
              if ext not in {'.css','.js','.mjs','.png','.jpg','.jpeg','.webp','.avif','.svg','.ico','.woff','.woff2','.ttf','.json','.webmanifest'}:
                  continue
              name=Path(pr.path).name or hashlib.sha1(absu.encode()).hexdigest()
              safe=re.sub(r'[^A-Za-z0-9._-]','_',name)
              dest=Path('reference-capture/assets')/safe
              try:
                  req=Request(absu, headers={'User-Agent':'Mozilla/5.0'})
                  with urlopen(req, timeout=25) as r: data=r.read()
                  dest.write_bytes(data)
                  out.append({'tag':tag,'attr':attr,'url':absu,'file':str(dest),'bytes':len(data),'content_type':r.headers.get('content-type')})
              except Exception as e:
                  out.append({'tag':tag,'attr':attr,'url':absu,'error':str(e)})
          Path('reference-capture/asset-manifest.json').write_text(json.dumps(out,indent=2))
          Path('reference-capture/discovered-urls.txt').write_text('\n'.join(sorted(seen)))
          PY

      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Render, inspect and audit live site
        run: |
          cat > /tmp/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          import fs from 'node:fs/promises';

          const base='https://ykg-digital-agency-v3.vercel.app';
          const browser=await chromium.launch({headless:true});
          const report={};

          async function inspect(name,path,viewport){
            const page=await browser.newPage({viewportSize:viewport});
            const consoleErrors=[]; const pageErrors=[]; const failed=[];
            page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||'failed'}));
            const response=await page.goto(base+path,{waitUntil:'networkidle',timeout:60000});
            await page.screenshot({path:`reference-capture/screenshots/${name}.png`,fullPage:true});
            const data=await page.evaluate(()=>({
              title:document.title,
              html:document.documentElement.outerHTML,
              text:document.body.innerText,
              links:[...document.querySelectorAll('a')].map(a=>({text:a.innerText.trim(),href:a.href})),
              images:[...document.images].map(i=>({src:i.currentSrc||i.src,alt:i.alt,width:i.naturalWidth,height:i.naturalHeight})),
              sections:[...document.querySelectorAll('section,main,header,footer')].map(el=>({tag:el.tagName,id:el.id,classes:el.className,heading:el.querySelector('h1,h2,h3')?.innerText||''})),
              dimensions:{scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,scrollHeight:document.documentElement.scrollHeight},
              reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches
            }));
            const axe=await new AxeBuilder({page}).analyze();
            report[name]={status:response?.status(),url:page.url(),title:data.title,links:data.links,images:data.images,sections:data.sections,dimensions:data.dimensions,consoleErrors,pageErrors,failedRequests:failed,axeViolations:axe.violations.map(v=>({id:v.id,impact:v.impact,description:v.description,nodes:v.nodes.length}))};
            await fs.writeFile(`reference-capture/raw/${name}-rendered.html`,data.html);
            await fs.writeFile(`reference-capture/raw/${name}-text.txt`,data.text);
            await page.close();
          }

          await inspect('home-desktop','/',{width:1440,height:1100});
          await inspect('home-mobile','/',{width:390,height:844});
          await inspect('case-study-desktop','/case-study',{width:1440,height:1100});
          await inspect('case-study-mobile','/case-study',{width:390,height:844});
          await fs.writeFile('reference-capture/browser-audit.json',JSON.stringify(report,null,2));
          await browser.close();
          JS
          node /tmp/capture.mjs

      - name: Commit capture to recovery branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-capture
          git commit -m "chore: capture canonical YKG agency reference" || exit 0
          git push origin HEAD:actual-site-recovery
