name: Finalize canonical agency source

on:
  push:
    branches: [actual-site-recovery]
    paths:
      - '.github/workflows/finalize-actual-site.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: actual-site-recovery
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean stale source and add current metadata
        run: |
          set -euo pipefail
          rm -rf reference-capture assets
          rm -f favicon.svg site.webmanifest
          mkdir -p public

          cat > public/favicon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="YKG Digital">
            <rect width="64" height="64" rx="14" fill="#0a0a08"/>
            <path d="M12 15h10l10 16 10-16h10L36.8 38.4V50h-9.6V38.4L12 15Z" fill="#f2ede4"/>
            <circle cx="50" cy="49" r="5" fill="#ff4d00"/>
          </svg>
          SVG

          cat > public/site.webmanifest <<'JSON'
          {"name":"YKG Digital","short_name":"YKG","description":"Creative technology studio for web design, development, AI products and interactive experiences.","start_url":"/","display":"standalone","background_color":"#0a0a08","theme_color":"#0b0a08","icons":[{"src":"/favicon.svg","sizes":"any","type":"image/svg+xml","purpose":"any"}]}
          JSON

          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<meta content="#0b0a08" name="theme-color"/>'
          addition=marker+'\n<link href="/favicon.svg" rel="icon" type="image/svg+xml"/>\n<link href="/site.webmanifest" rel="manifest"/>'
          if '/favicon.svg' not in s: s=s.replace(marker,addition)
          p.write_text(s)
          PY

          cat > README.md <<'MD'
          # YKG Digital — agency website

          Production source for the current **YKG Digital** creative-technology agency website. This repository is intentionally separate from the personal Yash Ganesh portfolio.

          ## Stack
          Vite · semantic HTML · CSS · vanilla JavaScript

          ## Current source
          - `index.html` — canonical one-page agency experience
          - `public/styles.css` — canonical visual system
          - `public/app.js` — primary interaction and scroll-motion system
          - `public/site-fixes.css` / `public/site-fixes.js` — surgical QA/accessibility hardening
          - `public/assets/` — current hero/founder imagery
          - `tests/` — integrity, browser, accessibility, responsive, Lighthouse and load checks

          ## Run locally
          ```bash
          npm ci
          npm run dev
          ```

          ## Static production gate
          ```bash
          npm run qa:static
          ```

          CI additionally runs Chromium interaction tests, axe checks, seven viewport overflow checks, a 720-request concurrency test and mobile Lighthouse.
          MD

          cat > DESIGN.md <<'MD'
          # YKG Digital — implementation design note

          The current YKG Digital website is the visual and interaction source of truth. Preserve this art direction rather than restoring the retired BRAYROAI implementation.

          ## Visual language
          - Dark ink foundation with warm paper/orange chapters.
          - Space Grotesk display type, Manrope body/interface type and DM Mono metadata.
          - Full-screen photographic hero with independent background, oversized YKG DIGITAL typography and founder cutout layers.
          - Editorial section changes rather than repetitive SaaS cards.
          - Orange is the primary signal; lime, sky and warm neutrals are secondary accents.

          ## Interaction language
          - Short fail-safe intro sequence, scroll progress and chapter indicator.
          - One requestAnimationFrame scroll choreography for hero depth, manifesto motion, client proof and capability activation.
          - Lazy external FakhriMart frames; fine-pointer-only cursor/magnetics/tilt; full reduced-motion path.
          - Mobile navigation must retain focus containment, Escape close and focus return.

          ## Release rules
          - Zero serious/critical axe violations.
          - No document overflow at 360, 390, 430, 768, 1024, 1440 or 1920px.
          - Hero imagery and conversion/project destinations must resolve.
          - CSP must permit the site’s Google Fonts and FakhriMart iframe origin.
          MD

      - name: Validate and commit clean application tree
        run: |
          npm ci
          npm run qa:static
          test ! -d reference-capture
          test ! -d assets
          test -f public/favicon.svg
          test -f public/site.webmanifest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize clean YKG Digital application source"
          git push origin HEAD:actual-site-recovery
