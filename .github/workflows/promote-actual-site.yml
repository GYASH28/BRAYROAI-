name: Promote captured actual site

on:
  push:
    branches: [actual-site-recovery]
    paths:
      - '.github/workflows/promote-actual-site.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: actual-site-recovery
          fetch-depth: 1

      - name: Replace obsolete agency implementation with captured source
        run: |
          set -euo pipefail
          test -f reference-capture/raw/home.html
          test -f reference-capture/assets/styles.css
          test -f reference-capture/assets/app.js
          test -f reference-capture/assets/hero-background.webp
          test -f reference-capture/assets/yash-cutout.webp
          test -f reference-capture/assets/about-yash.webp

          rm -rf public
          mkdir -p public/assets tests

          cp reference-capture/raw/home.html index.html
          cp reference-capture/assets/styles.css public/styles.css
          cp reference-capture/assets/app.js public/app.js
          cp reference-capture/assets/hero-background.webp public/assets/hero-background.webp
          cp reference-capture/assets/yash-cutout.webp public/assets/yash-cutout.webp
          cp reference-capture/assets/about-yash.webp public/assets/about-yash.webp
          cp reference-capture/raw/robots.txt public/robots.txt

          rm -f brayroai-core.css brayroai-pages.css brayroai-responsive.css brayroai-sections.css brayroai.js work.html
          rm -rf work

          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<link href="/styles.css" rel="stylesheet"/>', '<link href="/styles.css" rel="stylesheet"/>\n<link href="/site-fixes.css" rel="stylesheet"/>')
          s=s.replace('<div aria-hidden="true" class="mobile-menu" data-mobile-menu="">\n<div class="mobile-menu-inner">', '<div aria-hidden="true" class="mobile-menu" data-mobile-menu="">\n<div aria-hidden="true" class="mobile-menu__bg"></div>\n<div class="mobile-menu-inner">')
          s=s.replace('<script defer="" src="/app.js"></script>', '<script defer src="/app.js"></script>\n<script defer src="/site-fixes.js"></script>')
          if '/site-fixes.css' not in s or 'mobile-menu__bg' not in s or '/site-fixes.js' not in s:
              raise SystemExit('Expected source patch did not apply')
          p.write_text(s)
          PY

          cat > public/site-fixes.css <<'CSS'
          /* Surgical QA fixes layered over the recovered canonical YKG Digital design. */
          .brand-dot{
            width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--orange);
            box-shadow:0 0 0 5px rgba(255,77,0,.08),0 0 16px rgba(255,77,0,.28)
          }

          /* The original HTML omitted this layer even though the design already defined it. */
          .mobile-menu__bg{position:absolute;inset:0;background:var(--orange);clip-path:circle(0% at calc(100% - 48px) 48px);transition:clip-path .6s var(--ease)}
          .mobile-menu.open .mobile-menu__bg{clip-path:circle(150% at calc(100% - 48px) 48px)}

          /* Keep inactive story steps visually secondary without failing WCAG AA. */
          .cap-step:not(.is-active){color:rgba(255,255,255,.62)}
          .cap-step:not(.is-active) p{color:rgba(255,255,255,.64);opacity:1}

          /* More legible keyboard focus on the orange/warm conversion areas. */
          .client-proof :focus-visible,.engage :focus-visible{outline-color:#15110d}

          @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
            .site-nav{background:rgba(10,10,8,.94)}
          }

          @media(max-width:760px){
            .mobile-menu a{min-height:44px}
            .mobile-contact{min-height:52px}
          }
          CSS

          cat > public/site-fixes.js <<'JS'
          // Progressive enhancement only; the recovered app remains the primary interaction layer.
          (() => {
            const button=document.querySelector('[data-menu-button]');
            const menu=document.querySelector('[data-mobile-menu]');
            if(!button||!menu) return;

            const focusables=()=>[...menu.querySelectorAll('a[href],button:not([disabled])')].filter(el=>el.offsetParent!==null);

            document.addEventListener('keydown',event=>{
              if(event.key!=='Tab'||button.getAttribute('aria-expanded')!=='true') return;
              const items=focusables();
              if(!items.length) return;
              const first=items[0],last=items[items.length-1];
              if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
              else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
            });

            addEventListener('resize',()=>{
              if(innerWidth>760&&button.getAttribute('aria-expanded')==='true') button.click();
            },{passive:true});
          })();
          JS

          cat > vite.config.mjs <<'JS'
          import { defineConfig } from 'vite';

          export default defineConfig({
            publicDir: 'public',
            build: {
              outDir: 'dist',
              emptyOutDir: true,
              assetsInlineLimit: 4096
            }
          });
          JS

          cat > package.json <<'JSON'
          {
            "name": "ykg-digital-agency",
            "private": true,
            "version": "3.1.0",
            "type": "module",
            "scripts": {
              "dev": "vite --host 0.0.0.0",
              "build": "vite build",
              "preview": "vite preview --host 0.0.0.0",
              "test:syntax": "node --check public/app.js && node --check public/site-fixes.js && node --check vite.config.mjs",
              "test:integrity": "node tests/integrity.mjs",
              "qa:static": "npm run test:syntax && npm run test:integrity && npm run build"
            },
            "devDependencies": {
              "vite": "latest"
            }
          }
          JSON

          cat > tests/integrity.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';

          const root=process.cwd();
          const read=p=>fs.readFileSync(path.join(root,p),'utf8');
          const html=read('index.html');
          const css=read('public/styles.css');
          const fixes=read('public/site-fixes.css');
          const js=read('public/app.js');
          const errors=[];
          const expect=(condition,message)=>{if(!condition) errors.push(message)};

          expect(html.includes('YKG Digital — Design + Engineering'),'canonical title missing');
          for(const id of ['main','top','intro','services','work','client-proof','lab','about','engage']) expect(html.includes(`id="${id}"`),`missing #${id}`);
          for(const asset of ['hero-background.webp','yash-cutout.webp','about-yash.webp']) expect(fs.existsSync(path.join(root,'public/assets',asset)),`missing ${asset}`);
          expect(html.includes('mobile-menu__bg'),'mobile menu background layer missing');
          expect(html.includes('/site-fixes.css')&&html.includes('/site-fixes.js'),'QA fix layer not wired');
          expect(css.includes('.hero-v3')&&css.includes('.capability-story'),'canonical visual system missing');
          expect(js.includes('paintHero')&&js.includes('paintCapability'),'canonical interaction system missing');
          expect(fixes.includes('.brand-dot')&&fixes.includes('.cap-step:not(.is-active)'),'critical CSS fixes missing');
          expect(!html.includes('BRAYROAI'),'obsolete BRAYROAI markup leaked into recovered site');
          expect(!html.includes('brayroai-'),'obsolete BRAYROAI asset reference leaked into recovered site');

          const localRefs=[...html.matchAll(/(?:src|href)="\/(?!\/)([^"?#]+)["?#]?/g)].map(m=>m[1]);
          for(const ref of localRefs){
            if(ref.startsWith('#')) continue;
            const candidates=[path.join(root,'public',ref),path.join(root,ref)];
            expect(candidates.some(fs.existsSync),`missing local reference /${ref}`);
          }

          if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          console.log(`Integrity OK: ${localRefs.length} local references checked`);
          JS

          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "vite",
            "buildCommand": "npm run build",
            "outputDirectory": "dist",
            "cleanUrls": true,
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  {"key":"X-Content-Type-Options","value":"nosniff"},
                  {"key":"X-Frame-Options","value":"DENY"},
                  {"key":"Referrer-Policy","value":"strict-origin-when-cross-origin"},
                  {"key":"Permissions-Policy","value":"camera=(), microphone=(), geolocation=(), payment=(), usb=()"},
                  {"key":"Cross-Origin-Opener-Policy","value":"same-origin"},
                  {"key":"Content-Security-Policy","value":"default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; font-src 'self' data: https://fonts.gstatic.com; frame-src https://fakhriyarns.vercel.app; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' mailto:; upgrade-insecure-requests"}
                ]
              },
              {
                "source": "/assets/(.*)",
                "headers": [
                  {"key":"Cache-Control","value":"public, max-age=86400, s-maxage=604800, stale-while-revalidate=86400"}
                ]
              },
              {
                "source": "/(app.js|site-fixes.js|styles.css|site-fixes.css)",
                "headers": [
                  {"key":"Cache-Control","value":"public, max-age=3600, s-maxage=86400, stale-while-revalidate=3600"}
                ]
              }
            ]
          }
          JSON

          npm install --package-lock-only --ignore-scripts
          npm run qa:static

      - name: Commit recovered source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restore canonical YKG Digital site with QA fixes" || exit 0
          git push origin HEAD:actual-site-recovery
