name: BRAYROAI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brayroai-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Build + frozen-contract + architecture integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:static
      - name: Guard production bundle
        run: |
          set -euo pipefail
          for file in index.html services.html work.html plans.html contact.html styles.css film.css pages.css app.js pages.js; do test -f "dist/$file"; done
          for asset in hero-background.webp yash-cutout.webp about-yash.webp fakhrimart-case-desktop.png fakhrimart-case-mobile.png; do test -f "dist/assets/$asset"; done
          for stale in site-fixes.css experience.css cinematic.css commercial.css clarity.css plans.css plans.js; do ! test -f "dist/$stale"; done
          grep -q 'Digital, designed' dist/index.html
          grep -q 'id="thesis"' dist/index.html
          grep -q 'id="services"' dist/index.html
          grep -q 'id="work"' dist/index.html
          grep -q 'id="plans"' dist/index.html
          grep -q 'id="contact"' dist/index.html
          grep -q '₹2,599' dist/index.html
          grep -q '₹3,999' dist/index.html
          grep -q '₹5,999+' dist/index.html
          grep -q "potential','structure','interface','system','proof','scope','human','identity" dist/app.js
          ! grep -q '₹9,999' dist/index.html
          ! grep -q '₹17,999' dist/index.html
          CRITICAL=$(wc -c < dist/styles.css); FILM=$(wc -c < dist/film.css); PAGES=$(wc -c < dist/pages.css); APP=$(wc -c < dist/app.js)
          echo "styles.css=$CRITICAL film.css=$FILM pages.css=$PAGES app.js=$APP"
          test "$CRITICAL" -lt 24000
          test "$FILM" -lt 30000
          test "$PAGES" -lt 16000
          test "$APP" -lt 30000
          TOTAL=$(du -sk dist | cut -f1); echo "dist size=${TOTAL}KB"; test "$TOTAL" -lt 2600

  browser-and-load:
    name: Browser + a11y + load + visual evidence + Lighthouse
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install QA tooling
        run: npm install --no-save @playwright/test@latest @axe-core/playwright@latest lighthouse@latest
      - name: Install Chromium
        run: npx playwright install chromium
      - run: npm run build
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/brayroai-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ | grep -q 'id="thesis"' && curl -fsS http://127.0.0.1:4173/plans | grep -q '₹2,599'; then exit 0; fi
            sleep 1
          done
          cat /tmp/brayroai-preview.log; exit 1
      - name: Concurrent stress test
        env:
          BASE_URL: http://127.0.0.1:4173
          STRESS_REQUESTS: 1000
          STRESS_CONCURRENCY: 45
        run: npm run test:stress
      - name: Cross-viewport interaction and accessibility tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test
      - name: Capture homepage director cuts and deep pages
        run: |
          mkdir -p artifacts/screenshots
          node - <<'JS'
          const { chromium } = require('playwright');
          const warmLazyMedia=async page=>{
            await page.evaluate(async()=>{
              const step=Math.max(320,Math.floor(innerHeight*.72));
              for(let y=0;y<document.documentElement.scrollHeight;y+=step){
                window.scrollTo(0,y);
                await new Promise(resolve=>setTimeout(resolve,55));
              }
              window.scrollTo(0,document.documentElement.scrollHeight);
              await new Promise(resolve=>setTimeout(resolve,160));
              await Promise.all([...document.images].map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true})})));
              window.scrollTo(0,0);
              await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
            });
          };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const homeFrames=[['hero','#top'],['thesis','#thesis'],['services','#services'],['work','#work'],['plans','#plans'],['contact','#contact']];
            const viewports=[['desktop-1440',1440,900],['desktop-1280',1280,800],['tablet',768,1024],['mobile-430',430,932],['mobile-390',390,844],['mobile-360',360,800],['mobile-320',320,720]];
            for(const [device,width,height] of viewports){
              const context=await browser.newContext({viewport:{width,height}}); const page=await context.newPage();
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              await page.waitForFunction(()=>document.body.classList.contains('hero-ready'));
              await page.evaluate(()=>document.documentElement.style.scrollBehavior='auto');
              for(const [name,target] of homeFrames){
                await page.evaluate(target=>document.querySelector(target)?.scrollIntoView({block:'start',behavior:'auto'}),target);
                await page.waitForTimeout(name==='hero'?1100:240);
                await page.screenshot({path:`artifacts/screenshots/${device}-${name}.png`,fullPage:false});
              }
              await context.close();
            }
            for(const [device,width,height] of [['desktop',1440,900],['mobile',390,844]]){
              const context=await browser.newContext({viewport:{width,height}}); const page=await context.newPage();
              for(const route of ['services','work','plans','contact']){
                await page.goto(`http://127.0.0.1:4173/${route}`,{waitUntil:'networkidle'});
                await warmLazyMedia(page);
                await page.screenshot({path:`artifacts/screenshots/${device}-page-${route}.png`,fullPage:true});
              }
              await context.close();
            }
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - name: Lighthouse mobile audits
        run: |
          mkdir -p artifacts/lighthouse
          for route in home services work plans contact; do
            URL="http://127.0.0.1:4173/"; [ "$route" != home ] && URL="http://127.0.0.1:4173/$route"
            npx lighthouse "$URL" --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path="artifacts/lighthouse/$route.json"
          done
          node tests/lighthouse-budget.mjs artifacts/lighthouse/home.json artifacts/lighthouse/services.json artifacts/lighthouse/work.json artifacts/lighthouse/plans.json artifacts/lighthouse/contact.json
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brayroai-rebuild-qa-${{ github.run_number }}
          path: |
            dist/
            artifacts/
            test-results/
            /tmp/brayroai-preview.log
          if-no-files-found: ignore
          retention-days: 14
