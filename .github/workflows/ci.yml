name: BRAYRO AI quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brayroai-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-quality:
    name: Source, API and distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:static
      - name: Preserve quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brayro-static-${{ github.run_number }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
  browser-and-load:
    name: Journey, access, load and Lighthouse
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/brayroai-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ -o /tmp/brayroai-preview-home.html && grep -q 'Make your mark.' /tmp/brayroai-preview-home.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/brayroai-preview.log
          exit 1
      - name: Lighthouse mobile audit
        run: |
          node scripts/audit-lighthouse.mjs http://127.0.0.1:4173/ artifacts/lighthouse/home.json
      - name: Motion performance evidence
        run: |
          node scripts/profile-home.mjs http://127.0.0.1:4173/ artifacts/performance
      - run: npm run test:stress
      - run: npm run test:browser
      - run: node scripts/capture-preview.mjs
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brayroai-qa-${{ github.run_number }}
          path: |
            artifacts/screenshots/
            artifacts/lighthouse/
            artifacts/performance/
            artifacts/playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
