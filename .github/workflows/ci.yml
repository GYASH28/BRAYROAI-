name: BRAYROAI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brayroai-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Build + architecture integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:static
      - name: Guard production bundle
        run: |
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/site-fixes.css
          test -f dist/experience.css
          test -f dist/app.js
          test -f dist/assets/hero-background.webp
          test -f dist/assets/yash-cutout.webp
          test -f dist/assets/about-yash.webp
          test -f dist/assets/fakhrimart-case-desktop.png
          test -f dist/assets/fakhrimart-case-mobile.png
          ! test -f dist/site-fixes-core.css
          grep -q 'Digital, designed' dist/index.html
          grep -q 'id="plans"' dist/index.html
          grep -q '₹9,999' dist/index.html
          grep -q '₹17,999' dist/index.html
          grep -q 'class PlanPriorityController' dist/app.js
          grep -q "this.entry.setAttribute('data-plan-recommended','')" dist/app.js
          grep -q 'body.v10-polished' dist/site-fixes.css
          grep -q 'class BRAYROExperience' dist/app.js
          ! grep -q 'service-rail' dist/experience.css
          ! grep -q 'work-slices' dist/experience.css
          ! test -f dist/plans.html
          ! test -f dist/case-studies/fakhrimart.html
          ! test -f dist/plans.js
          ! test -f dist/commercial.css
          ! test -f dist/commercial-fixes.css
          ! test -f dist/commercial-accessibility.css
          CSS_BYTES=$(wc -c < dist/styles.css)
          echo "critical CSS: ${CSS_BYTES} bytes"
          test "$CSS_BYTES" -lt 24000
          TOTAL=$(du -sk dist | cut -f1)
          echo "dist size: ${TOTAL}KB"
          test "$TOTAL" -lt 2380

  browser-and-load:
    name: Browser + a11y + load + Lighthouse
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install QA tooling
        run: npm install --no-save @playwright/test@latest @axe-core/playwright@latest lighthouse@latest
      - name: Install Chromium
        run: npx playwright install chromium
      - run: npm run build
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/brayroai-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ | grep -q 'id="plans"' && curl -fsS http://127.0.0.1:4173/ | grep -q '₹9,999'; then exit 0; fi
            sleep 1
          done
          cat /tmp/brayroai-preview.log
          exit 1
      - name: Concurrent stress test
        env:
          BASE_URL: http://127.0.0.1:4173
          STRESS_REQUESTS: 900
          STRESS_CONCURRENCY: 45
        run: npm run test:stress
      - name: Cross-viewport interaction and accessibility tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test
      - name: Capture sales and mobile UI keyframes
        run: |
          mkdir -p artifacts/screenshots
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const frames=[
              ['hero',null,0],
              ['plans','#plans',0],
              ['plan-cards','.plan-grid',-92],
              ['work','#work',0],
              ['work-proof','.proof-stage',-90],
              ['services','#services',0],
              ['system','#system',0],
              ['studio','#studio',0],
              ['contact','#contact',0]
            ];
            for(const [device,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
              const context=await browser.newContext({viewport:{width,height}});
              const page=await context.newPage();
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              await page.waitForFunction(()=>document.body.classList.contains('hero-ready'));
              await page.waitForFunction(()=>document.body.classList.contains('experience-ready'));
              await page.evaluate(()=>{document.documentElement.style.scrollBehavior='auto'});
              for(const [name,target,offset] of frames){
                if(!target){await page.evaluate(()=>window.scrollTo(0,0));}
                else{await page.evaluate(({target,offset})=>{const el=document.querySelector(target);const top=el.getBoundingClientRect().top+window.scrollY+offset;window.scrollTo(0,Math.max(0,top));},{target,offset});}
                await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
                await page.waitForTimeout(name==='hero'?1350:240);
                await page.screenshot({path:`artifacts/screenshots/${device}-${name}.png`,fullPage:false});
              }
              await context.close();
            }
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - name: Lighthouse mobile audit
        run: |
          mkdir -p artifacts/lighthouse
          npx lighthouse http://127.0.0.1:4173/ --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path=artifacts/lighthouse/home.json
          node tests/lighthouse-budget.mjs artifacts/lighthouse/home.json
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brayroai-qa-${{ github.run_number }}
          path: |
            dist/
            artifacts/
            test-results/
            /tmp/brayroai-preview.log
          if-no-files-found: ignore
          retention-days: 14
