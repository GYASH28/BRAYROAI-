name: BRAYROAI Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  production-smoke:
    name: Production deployment + browser + load + Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install production QA tooling
        run: npm install --no-save @playwright/test@latest @axe-core/playwright@latest lighthouse@latest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact merged source
        run: npm run build
      - name: Resolve and verify this commit's Vercel Production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEPLOYMENT_ID=""
          for i in {1..36}; do
            DEPLOYMENT_ID=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=20" | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.sha==$sha and .environment=="Production")][0].id // empty')
            if [ -n "$DEPLOYMENT_ID" ]; then break; fi
            sleep 10
          done
          test -n "$DEPLOYMENT_ID"
          STATE=""; PROD_URL=""
          for i in {1..36}; do
            STATUS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses?per_page=10")
            STATE=$(printf '%s' "$STATUS" | jq -r '.[0].state // empty')
            PROD_URL=$(printf '%s' "$STATUS" | jq -r '.[0].environment_url // empty')
            if [ "$STATE" = "success" ]; then break; fi
            if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then exit 1; fi
            sleep 10
          done
          test "$STATE" = "success"; test -n "$PROD_URL"
          echo "PROD_URL=$PROD_URL" >> "$GITHUB_ENV"
          HTTP_CODE=$(curl -L -sS --max-time 25 -o /tmp/brayroai-prod-home.html -w '%{http_code}' "$PROD_URL/" || true)
          if [ "$HTTP_CODE" = "200" ] && grep -q 'BRAYROAI' /tmp/brayroai-prod-home.html && grep -q 'Digital, designed' /tmp/brayroai-prod-home.html; then
            echo "QA_URL=$PROD_URL" >> "$GITHUB_ENV"; echo "QA_MODE=vercel-public" >> "$GITHUB_ENV"
          else
            echo "QA_URL=http://127.0.0.1:4173" >> "$GITHUB_ENV"; echo "QA_MODE=vercel-protected-local-build" >> "$GITHUB_ENV"
          fi
      - name: Start exact production build when Vercel is protected
        if: env.QA_MODE == 'vercel-protected-local-build'
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/brayroai-production-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ | grep -q 'BRAYROAI'; then exit 0; fi
            sleep 1
          done
          cat /tmp/brayroai-production-preview.log; exit 1
      - name: Production-equivalent concurrent load test
        env:
          BASE_URL: ${{ env.QA_URL }}
          STRESS_REQUESTS: 360
          STRESS_CONCURRENCY: 20
        run: npm run test:stress
      - name: Production-equivalent browser and accessibility suite
        env:
          BASE_URL: ${{ env.QA_URL }}
        run: npx playwright test
      - name: Production-equivalent Lighthouse mobile audit
        run: |
          mkdir -p artifacts/production-lighthouse
          npx lighthouse "$QA_URL/" --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path=artifacts/production-lighthouse/home.json
          node tests/lighthouse-budget.mjs artifacts/production-lighthouse/home.json
      - name: Record deployment verification
        if: always()
        run: |
          mkdir -p artifacts
          printf 'commit=%s\nproduction_url=%s\nqa_url=%s\nqa_mode=%s\n' "$GITHUB_SHA" "${PROD_URL:-unresolved}" "${QA_URL:-unresolved}" "${QA_MODE:-unresolved}" > artifacts/deployment-verification.txt
      - name: Upload production QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brayroai-production-qa-${{ github.run_number }}
          path: |
            artifacts/
            test-results/
            /tmp/brayroai-production-preview.log
          if-no-files-found: ignore
          retention-days: 14
