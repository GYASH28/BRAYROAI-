name: One-time BRAYROAI migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-from-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BRAYROAI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone agency source snapshot
        run: |
          git clone --depth 1 --branch brayroai-brand-v1 https://github.com/GYASH28/YASH_PORTFOLIO.git /tmp/brayro-source

      - name: Rebuild target as a clean agency repository
        shell: bash
        run: |
          set -euo pipefail

          # Preserve git metadata and the one-time migration workflow only.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +

          mkdir -p assets work

          cp /tmp/brayro-source/index.html ./index.html
          cp /tmp/brayro-source/work.html ./work.html
          cp /tmp/brayro-source/work/fakhrimart.html ./work/fakhrimart.html
          cp /tmp/brayro-source/brayroai-core.css ./brayroai-core.css
          cp /tmp/brayro-source/brayroai-sections.css ./brayroai-sections.css
          cp /tmp/brayro-source/brayroai-pages.css ./brayroai-pages.css
          cp /tmp/brayro-source/brayroai-responsive.css ./brayroai-responsive.css
          cp /tmp/brayro-source/brayroai.js ./brayroai.js
          cp /tmp/brayro-source/package.json ./package.json
          cp /tmp/brayro-source/vite.config.mjs ./vite.config.mjs
          cp /tmp/brayro-source/vercel.json ./vercel.json
          cp /tmp/brayro-source/DESIGN.md ./DESIGN.md

          # Only assets referenced by the BRAYROAI experience/case study are migrated.
          cp /tmp/brayro-source/assets/ykg-hero-v13-4k.jpg assets/
          cp /tmp/brayro-source/assets/fakhri-mart-home.webp assets/
          cp /tmp/brayro-source/assets/hero-ai.avif assets/
          cp /tmp/brayro-source/assets/desktop-light-home-section-00.png assets/
          cp /tmp/brayro-source/assets/desktop-light-catalogue-section-00.png assets/
          cp /tmp/brayro-source/assets/fakhrimart-mobile-current.avif assets/
          cp /tmp/brayro-source/assets/desktop-light-compare.png assets/
          cp /tmp/brayro-source/assets/fakhrimart-desktop-current.avif assets/

          cat > README.md <<'EOF'
          # BRAYROAI

          **Design. Engineering. AI.**

          BRAYROAI is a founder-led creative technology studio building premium websites, digital experiences, frontend systems, and useful AI products.

          ## Stack
          - Vite
          - Semantic HTML
          - CSS
          - Vanilla JavaScript

          ## Local development
          ```bash
          npm install
          npm run dev
          ```

          ## Production build
          ```bash
          npm run build
          ```

          ## Structure
          - `index.html` — agency homepage
          - `work.html` — selected work archive
          - `work/fakhrimart.html` — FakhriMart case study
          - `brayroai-*.css` — visual system and responsive art direction
          - `brayroai.js` — motion and interaction layer
          - `DESIGN.md` — canonical BRAYROAI design source of truth
          - `assets/` — agency/project imagery actually used by the site

          This repository is intentionally separate from the personal Yash Ganesh portfolio.
          EOF

          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          .vercel/
          .env
          .env.*
          *.log
          .DS_Store
          EOF

      - name: Install and verify production build
        run: |
          npm install
          npm run build

      - name: Commit migrated agency code and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: migrate BRAYROAI into dedicated agency repository" || exit 0
          git push origin main
