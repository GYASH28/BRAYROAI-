name: BRAYROAI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brayroai-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Build + architecture integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:static
      - name: Guard production bundle
        run: |
          for f in index.html plans.html founder.html terms.html ai-workflow-audit.html company-second-brain.html commercial-cut.css commercial-cut.js direction-pass.css direction-pass.js motion-v4.css motion-v5.css motion-v5.js motion-v6.css motion-v6.js art-direction-v7.css art-direction-v7-contrast.css art-direction-v7.js work-showcase-v8.css work-showcase-v8.js plans-page.css plans-page.js founder-page.css founder-page.js terms-page.css terms-page.js scrollcraft.css scrollcraft.js brayro-v12.css brayro-v13.css brayro-v14.css brayro-v14-polish.css brayro-v15.css brayro-v12.js brayro-v14.js brayro-v15.js v15-accessibility.css experience-motion-v16.css experience-motion-v16.js ai-service-pages.css ai-service-pages.js; do test -f "dist/$f"; done
          test -f dist/assets/brayroai-cinematic-opening.mp4
          test -f dist/assets/fakhrimart-case-desktop.png
          test -f dist/assets/fakhrimart-case-mobile.png
          grep -q 'data-editorial-sequence' dist/index.html
          grep -q 'FEATURED CLIENT / FAKHRIMART' dist/index.html
          grep -q 'fakhriyarns.vercel.app' dist/index.html
          grep -q 'AI Workflow Audit' dist/index.html
          grep -q 'Company Second Brain' dist/index.html
          grep -q '₹2,599' dist/index.html
          grep -q '₹9,999' dist/index.html
          grep -q '₹17,999' dist/index.html
          grep -q '₹25K–₹35K+' dist/index.html
          grep -q '₹29,999' dist/index.html
          grep -q 'PER MONTH / ONGOING' dist/plans.html
          grep -q 'ONE-TIME BUILD' dist/plans.html
          grep -q 'AI Workflow Audit' dist/plans.html
          grep -q 'Company Second Brain' dist/plans.html
          grep -q 'Knowledge Care' dist/plans.html
          grep -q 'AI WORKFLOW AUDIT / ₹9,999' dist/ai-workflow-audit.html
          grep -q 'Five steps.' dist/ai-workflow-audit.html
          grep -q 'COMPANY SECOND BRAIN / FROM ₹29,999' dist/company-second-brain.html
          grep -q 'BASE SCOPE VS EXPANDED SCOPE' dist/company-second-brain.html
          grep -q 'Terms & Conditions' dist/terms.html
          grep -q 'class CapabilityLedger' dist/brayro-v12.js
          grep -q 'class CinematicCapabilities' dist/brayro-v14.js
          grep -q 'class PlayfulCapabilities' dist/brayro-v15.js
          grep -q 'PLAYGROUND 02' dist/brayro-v15.js
          grep -q '.play-scene__cursor' dist/brayro-v15.css
          grep -q 'class ProcessLab' dist/ai-service-pages.js
          grep -q 'class ArchitectureLab' dist/ai-service-pages.js
          grep -q '.architecture' dist/ai-service-pages.css
          grep -q 'class SceneKinetics' dist/experience-motion-v16.js
          grep -q 'class PointerFeedback' dist/experience-motion-v16.js
          grep -q '.v16-page-transition' dist/experience-motion-v16.css
          grep -q 'body.terms-v16' dist/experience-motion-v16.css
          grep -q 'body.ai-v16' dist/experience-motion-v16.css
          for page in index.html plans.html founder.html terms.html ai-workflow-audit.html company-second-brain.html; do
            grep -q '/experience-motion-v16.css' "dist/$page"
            grep -q '/experience-motion-v16.js' "dist/$page"
          done
          grep -q '/brayro-v15.css' dist/index.html
          grep -q '/brayro-v15.js' dist/index.html
          ! grep -q 'data-commercial-film' dist/index.html
          ! grep -q 'data-signal-chamber' dist/index.html
          test ! -f dist/experience-v2.css
          TOTAL=$(du -sk dist | cut -f1)
          echo "dist size: ${TOTAL}KB"
          test "$TOTAL" -lt 10300

  browser-and-load:
    name: Browser + a11y + load + Lighthouse
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install QA tooling
        run: npm install --no-save @playwright/test@latest @axe-core/playwright@latest lighthouse@latest
      - name: Install Chromium
        run: npx playwright install chromium
      - run: npm run build
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/brayroai-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ | grep -q 'Company Second Brain' && curl -fsS http://127.0.0.1:4173/ai-workflow-audit | grep -q 'AI WORKFLOW AUDIT' && curl -fsS http://127.0.0.1:4173/company-second-brain | grep -q 'COMPANY SECOND BRAIN' && curl -fsS http://127.0.0.1:4173/brayro-v15.js | grep -q 'PlayfulCapabilities' && curl -fsS http://127.0.0.1:4173/experience-motion-v16.js | grep -q 'SceneKinetics'; then exit 0; fi
            sleep 1
          done
          cat /tmp/brayroai-preview.log
          exit 1
      - name: Concurrent stress test
        env:
          BASE_URL: http://127.0.0.1:4173
          STRESS_REQUESTS: 900
          STRESS_CONCURRENCY: 45
        run: npm run test:stress
      - name: Cross-viewport interaction and accessibility tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test
      - name: Capture key pages
        run: |
          mkdir -p artifacts/screenshots
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [device,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
              const context=await browser.newContext({viewport:{width,height}});
              const page=await context.newPage();
              for(const [route,name] of [['/','home'],['/plans','plans'],['/founder','founder'],['/terms','terms'],['/ai-workflow-audit','audit'],['/company-second-brain','second-brain']]){
                await page.goto(`http://127.0.0.1:4173${route}`,{waitUntil:'networkidle'});
                await page.evaluate(()=>{document.querySelectorAll('.opening-sequence,.scope-open,.founder-open').forEach(n=>n.remove());document.body.classList.remove('hf-intro-active','polish-opening','is-opening')});
                await page.waitForTimeout(700);
                await page.screenshot({path:`artifacts/screenshots/${device}-${name}.png`,fullPage:false});
              }
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              await page.evaluate(()=>{document.querySelectorAll('.opening-sequence').forEach(n=>n.remove());document.body.classList.remove('hf-intro-active');document.querySelector('#services')?.scrollIntoView()});
              await page.waitForTimeout(520);
              await page.screenshot({path:`artifacts/screenshots/${device}-services.png`,fullPage:false});
              await page.evaluate(()=>document.querySelector('#plans')?.scrollIntoView());
              await page.waitForTimeout(520);
              await page.screenshot({path:`artifacts/screenshots/${device}-home-pricing.png`,fullPage:false});
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Lighthouse mobile audit
        run: |
          mkdir -p artifacts/lighthouse
          npx lighthouse http://127.0.0.1:4173/ --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path=artifacts/lighthouse/home.json
          node tests/lighthouse-budget.mjs artifacts/lighthouse/home.json
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brayroai-qa-${{ github.run_number }}
          path: |
            dist/
            artifacts/
            test-results/
            /tmp/brayroai-preview.log
          if-no-files-found: ignore
          retention-days: 14