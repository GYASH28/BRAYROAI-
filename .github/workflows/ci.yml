name: BRAYROAI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brayroai-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Build + architecture integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:static
      - name: Guard production bundle
        run: |
          for f in index.html plans.html founder.html terms.html commercial-cut.css commercial-cut.js direction-pass.css direction-pass.js motion-v4.css motion-v5.css motion-v5.js motion-v6.css motion-v6.js art-direction-v7.css art-direction-v7.js plans-page.css plans-page.js founder-page.css founder-page.js terms-page.css terms-page.js scrollcraft.css scrollcraft.js; do test -f "dist/$f"; done
          test -f dist/assets/brayroai-cinematic-opening.mp4
          grep -q 'data-editorial-sequence' dist/index.html
          grep -q '₹2,599' dist/index.html
          grep -q '₹3,999' dist/index.html
          grep -q '₹5,999+' dist/index.html
          grep -q '₹9,999' dist/index.html
          grep -q '₹17,999' dist/index.html
          grep -q '₹25K–₹35K+' dist/index.html
          grep -q 'Ongoing website partnership' dist/index.html
          grep -q 'Complete website builds' dist/index.html
          grep -q 'PER MONTH / ONGOING' dist/plans.html
          grep -q 'ONE-TIME BUILD' dist/plans.html
          grep -q 'data-plan-mode="monthly"' dist/plans.html
          grep -q 'data-plan-mode="onetime"' dist/plans.html
          grep -q 'Terms & Conditions' dist/terms.html
          grep -q 'Effective 24 August 2026' dist/terms.html
          grep -q 'class WorkMorphDialog' dist/motion-v6.js
          grep -q 'class ActiveNavIndicator' dist/motion-v6.js
          grep -q '/motion-v6.css' dist/motion-v5.js
          grep -q '/motion-v6.js' dist/motion-v5.js
          grep -q '/art-direction-v7.css' dist/motion-v6.js
          grep -q '/art-direction-v7.js' dist/motion-v6.js
          grep -q 'class WorkFrame' dist/art-direction-v7.js
          grep -q 'class RecommendedPlans' dist/art-direction-v7.js
          grep -q '.pricing-mini.v7-recommended' dist/art-direction-v7.css
          grep -q 'body.terms-body' dist/art-direction-v7.css
          ! grep -q 'data-commercial-film' dist/index.html
          ! grep -q 'data-signal-chamber' dist/index.html
          test ! -f dist/experience-v2.css
          TOTAL=$(du -sk dist | cut -f1)
          echo "dist size: ${TOTAL}KB"
          test "$TOTAL" -lt 9500

  browser-and-load:
    name: Browser + a11y + load + Lighthouse
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install QA tooling
        run: npm install --no-save @playwright/test@latest @axe-core/playwright@latest lighthouse@latest
      - name: Install Chromium
        run: npx playwright install chromium
      - run: npm run build
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/brayroai-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ | grep -q '₹17,999' && curl -fsS http://127.0.0.1:4173/terms | grep -q 'Terms & Conditions' && curl -fsS http://127.0.0.1:4173/art-direction-v7.js | grep -q 'WorkFrame'; then exit 0; fi
            sleep 1
          done
          cat /tmp/brayroai-preview.log
          exit 1
      - name: Concurrent stress test
        env:
          BASE_URL: http://127.0.0.1:4173
          STRESS_REQUESTS: 900
          STRESS_CONCURRENCY: 45
        run: npm run test:stress
      - name: Cross-viewport interaction and accessibility tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test
      - name: Capture key pages
        run: |
          mkdir -p artifacts/screenshots
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [device,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
              const context=await browser.newContext({viewport:{width,height}});
              const page=await context.newPage();
              for(const [route,name] of [['/','home'],['/plans','plans'],['/founder','founder'],['/terms','terms']]){
                await page.goto(`http://127.0.0.1:4173${route}`,{waitUntil:'networkidle'});
                await page.evaluate(()=>{document.querySelectorAll('.opening-sequence').forEach(n=>n.remove());document.body.classList.remove('hf-intro-active')});
                await page.waitForTimeout(420);
                await page.screenshot({path:`artifacts/screenshots/${device}-${name}.png`,fullPage:false});
              }
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Lighthouse mobile audit
        run: |
          mkdir -p artifacts/lighthouse
          npx lighthouse http://127.0.0.1:4173/ --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path=artifacts/lighthouse/home.json
          node tests/lighthouse-budget.mjs artifacts/lighthouse/home.json
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brayroai-qa-${{ github.run_number }}
          path: |
            dist/
            artifacts/
            test-results/
            /tmp/brayroai-preview.log
          if-no-files-found: ignore
          retention-days: 14
