name: BRAYROAI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brayroai-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Build + integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:static
      - name: Guard production bundle
        run: |
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/app.js
          test -f dist/site-fixes.css
          test -f dist/site-fixes.js
          test -f dist/polish.css
          test -f dist/experience.css
          test -f dist/experience-fixes.css
          test -f dist/experience.js
          test -f dist/assets/hero-background.webp
          test -f dist/assets/yash-cutout.webp
          test -f dist/assets/about-yash.webp
          grep -q 'BRAYROAI' dist/index.html
          ! grep -qi 'YKG Digital' dist/index.html
          grep -q '/experience.css' dist/site-fixes.js
          grep -q '/experience-fixes.css' dist/site-fixes.js
          grep -q '/experience.js' dist/site-fixes.js
          TOTAL=$(du -sk dist | cut -f1)
          echo "dist size: ${TOTAL}KB"
          test "$TOTAL" -lt 2700

  browser-and-load:
    name: Browser + a11y + load + Lighthouse
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install QA tooling
        run: npm install --no-save @playwright/test@latest @axe-core/playwright@latest lighthouse@latest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/brayroai-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ | grep -q 'BRAYROAI'; then exit 0; fi
            sleep 1
          done
          cat /tmp/brayroai-preview.log
          exit 1
      - name: Concurrent stress test
        env:
          BASE_URL: http://127.0.0.1:4173
          STRESS_REQUESTS: 720
          STRESS_CONCURRENCY: 36
        run: npm run test:stress
      - name: Cross-viewport interaction and accessibility tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test
      - name: Capture complete QA reference screenshots
        run: |
          mkdir -p artifacts/screenshots
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
              const context=await browser.newContext({viewport:{width,height}});
              const page=await context.newPage();
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              await page.waitForFunction(()=>document.body.classList.contains('hero-ready'));
              await page.waitForFunction(()=>document.body.classList.contains('experience-ready'));
              for(const id of ['intro','services','work','client-proof','lab','process','about','engage']){
                await page.locator(`#${id}`).scrollIntoViewIfNeeded();
                await page.waitForTimeout(180);
              }
              await page.evaluate(()=>scrollTo(0,0));
              await page.waitForTimeout(360);
              await page.screenshot({path:`artifacts/screenshots/${name}.png`,fullPage:true});
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Lighthouse mobile audit
        run: |
          mkdir -p artifacts/lighthouse
          npx lighthouse http://127.0.0.1:4173/ --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path=artifacts/lighthouse/home.json
          node tests/lighthouse-budget.mjs artifacts/lighthouse/home.json
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brayroai-qa-${{ github.run_number }}
          path: |
            artifacts/
            test-results/
            /tmp/brayroai-preview.log
          if-no-files-found: ignore
          retention-days: 14
